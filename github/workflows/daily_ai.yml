name: Daily AI Question Generator

on:
  schedule:
    # 每天北京时间早上 8 点运行一次 (UTC 时间 0 点)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许你手动点击按钮触发，方便测试

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install openai

      - name: Run generation script
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: python daily_ai.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add bank.json
          git commit -m "Update question bank by AI" || exit 0
          git push